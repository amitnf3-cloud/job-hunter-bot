# Job Hunter Bot - Search Configuration
# Edit these values to tune what the bot searches for and how it scores results.

# Each track is searched separately and scored against its own resume.
tracks:
  - id: data_analyst
    name: "Data Analyst / BI"
    # .local.txt - untracked, real resume content (see .gitignore /
    # README). resumes/data_analyst_resume.txt is a redacted placeholder
    # kept in git only to show the expected structure/format.
    resume_file: "resumes/data_analyst_resume.local.txt"
    # Used for keyword-filtering Telegram messages (case-insensitive
    # substring match). Add more terms as false negatives show up.
    keywords:
      - "data analyst"
      - "bi analyst"
      - "business intelligence"
      - "business intelligence analyst"
      - "business analyst"
      - "product analyst"
      - "fraud analyst"
      - "data analytics"
      - "analytics engineer"
      - "system analyst"
      - "systems analyst"
      # Compound phrases, not bare "product manager" - a data-flavored PM
      # role should also get scored against the data/BI resume, but a
      # generic Product Manager posting (unrelated to data) shouldn't.
      - "data product manager"
      - "product manager - data"
      - "product manager, data"

  - id: project_manager
    name: "Project Manager / Operations"
    # .local.txt - untracked, real resume content (see .gitignore /
    # README). resumes/project_manager_resume.txt is a redacted
    # placeholder kept in git only to show the expected structure/format.
    resume_file: "resumes/project_manager_resume.local.txt"
    keywords:
      - "project manager"
      - "operations manager"
      - "program manager"
      - "pmo"
      - "operations specialist"
      - "production specialist"
      - "product execution manager"
      # Hebrew for "operations" - catches Hebrew-titled postings like
      # "רכז.ת תפעול ואדמיניסטרציה" (Operations & Administration Coordinator)
      # that the English-only keywords above were structurally missing.
      - "תפעול"

# AI scoring settings (Claude API)
scoring:
  scale_min: 1
  scale_max: 10
  # TEMPORARY: lowered from 6 to 5 while tuning, to see more borderline
  # results in the digest.
  min_score_to_include: 5

# Email digest settings
email:
  subject_prefix: "Job Hunter Daily Digest"
  # The recipient address is NOT here - it's the EMAIL_TO secret/env var
  # (see run_daily_pipeline.py), so it doesn't need to be a public,
  # committed value.

# Where the bot keeps track of jobs it has already sent, to avoid duplicates.
storage:
  seen_jobs_file: "data/seen_jobs.json"

# Telegram job source (replacing SerpApi/Google Jobs, which had no usable
# coverage for Israel). "group" is the channel/group's public @username
# (without the @) if public, or its numeric chat ID if private - Telethon
# can resolve either once logged in.
telegram:
  group: "HiTech_Jobs_In_Israel"
  # Matches the daily schedule in daily-job-search.yml - a 24h lookback
  # covers exactly the messages since the previous day's run.
  hours_lookback: 24
  # A message is EXCLUDED only if it mentions a location_exclude_keywords
  # term and does NOT also mention a location_keywords term. A message that
  # doesn't mention location at all is included - this filter only cuts
  # obvious noise before spending Claude tokens; the scoring step already
  # judges location fit well on its own.
  #
  # "remote"/"hybrid" are intentionally NOT in this list - they say nothing
  # about which city the role is hybrid/remote *to*, so they must not
  # override an explicit exclude like "Jerusalem" (see
  # filter_messages.FLEXIBLE_LOCATION_KEYWORDS, checked with lower priority
  # than an exclude).
  location_keywords:
    - "tel aviv"
    - "תל אביב"
    - "gush dan"
    - "גוש דן"
    - "ramat gan"
    - "רמת גן"
    - "petah tikva"
    - "petach tikva"
    - "פתח תקווה"
  location_exclude_keywords:
    - "usa"
    - "united states"
    - "new york"
    - "san francisco"
    - "europe"
    - "uk "
    # Jerusalem alone shouldn't count as "Tel Aviv area" - a posting is
    # still included if it ALSO mentions Tel Aviv/Ramat Gan/Petah Tikva
    # (checked first, before this exclude list).
    - "jerusalem"
    - "ירושלים"
