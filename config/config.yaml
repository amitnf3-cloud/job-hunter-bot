# Job Hunter Bot - Search Configuration
# Edit these values to tune what the bot searches for and how it scores results.

location:
  # TEMPORARY SANITY CHECK: three Tel Aviv/Israel variations all returned
  # an identical zero-result error from SerpApi, which points at something
  # structural (gl='il', or account/plan access) rather than query wording.
  # Testing a well-known US location to isolate whether the pipeline can
  # return real jobs at all when the location isn't Israel-specific.
  city: "Austin, TX"
  radius_km: 10

# Each track is searched separately and scored against its own resume.
tracks:
  - id: data_analyst
    name: "Data Analyst / BI"
    # TEMPORARY: dropped the "OR" chain to a single plain term to test
    # whether Google Jobs' search box honors "OR" as an operator at all.
    search_query: "Data Analyst"
    resume_file: "resumes/data_analyst_resume.txt"

  - id: project_manager
    name: "Project Manager / Operations"
    # TEMPORARY: same single-term test as the track above.
    search_query: "Project Manager"
    resume_file: "resumes/project_manager_resume.txt"

# SerpApi Google Jobs settings (https://serpapi.com/google-jobs-api)
serpapi:
  engine: "google_jobs"
  google_domain: "google.com"
  hl: "en"   # interface language
  # TEMPORARY SANITY CHECK: gl set to "us" to match the Austin, TX test
  # location above - see the "location" section comment for why.
  gl: "us"   # country

# AI scoring settings (Claude API)
scoring:
  scale_min: 1
  scale_max: 10
  min_score_to_include: 6   # only jobs scoring this or higher go in the digest

# Email digest settings
email:
  subject_prefix: "Job Hunter Daily Digest"
  recipient: "amitnf3@gmail.com"

# Where the bot keeps track of jobs it has already sent, to avoid duplicates.
storage:
  seen_jobs_file: "data/seen_jobs.json"
