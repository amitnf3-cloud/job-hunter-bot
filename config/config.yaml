# Job Hunter Bot - Search Configuration
# Edit these values to tune what the bot searches for and how it scores results.

# Each track is searched separately and scored against its own resume.
tracks:
  - id: data_analyst
    name: "Data Analyst / BI"
    resume_file: "resumes/data_analyst_resume.txt"
    # Used for keyword-filtering Telegram messages (case-insensitive
    # substring match). Add more terms as false negatives show up.
    keywords:
      - "data analyst"
      - "bi analyst"
      - "business intelligence"
      - "data analytics"
      - "analytics engineer"
      - "system analyst"
      - "systems analyst"
      # Compound phrases, not bare "product manager" - a data-flavored PM
      # role should also get scored against the data/BI resume, but a
      # generic Product Manager posting (unrelated to data) shouldn't.
      - "data product manager"
      - "product manager - data"
      - "product manager, data"

  - id: project_manager
    name: "Project Manager / Operations"
    resume_file: "resumes/project_manager_resume.txt"
    keywords:
      - "project manager"
      - "operations manager"
      - "program manager"
      - "pmo"
      - "operations specialist"
      - "production specialist"

# AI scoring settings (Claude API)
scoring:
  scale_min: 1
  scale_max: 10
  # TEMPORARY: lowered from 6 to 5 while tuning, to see more borderline
  # results in the digest.
  min_score_to_include: 5

# Email digest settings
email:
  subject_prefix: "Job Hunter Daily Digest"
  recipient: "amitnf3@gmail.com"

# Where the bot keeps track of jobs it has already sent, to avoid duplicates.
storage:
  seen_jobs_file: "data/seen_jobs.json"

# Telegram job source (replacing SerpApi/Google Jobs, which had no usable
# coverage for Israel). "group" is the channel/group's public @username
# (without the @) if public, or its numeric chat ID if private - Telethon
# can resolve either once logged in.
telegram:
  group: "HiTech_Jobs_In_Israel"
  # TEMPORARY: widened from 24 to 48 hours while tuning, to see a bigger
  # sample in the digest.
  hours_lookback: 48
  # A message is EXCLUDED only if it mentions a location_exclude_keywords
  # term and does NOT also mention a location_keywords term. A message that
  # doesn't mention location at all is included - this filter only cuts
  # obvious noise before spending Claude tokens; the scoring step already
  # judges location fit well on its own.
  location_keywords:
    - "tel aviv"
    - "תל אביב"
    - "gush dan"
    - "גוש דן"
    - "ramat gan"
    - "רמת גן"
    - "petah tikva"
    - "petach tikva"
    - "פתח תקווה"
    - "remote"
    - "hybrid"
  location_exclude_keywords:
    - "usa"
    - "united states"
    - "new york"
    - "san francisco"
    - "europe"
    - "uk "
