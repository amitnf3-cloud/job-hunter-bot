name: Daily Job Search

on:
  schedule:
    # ~09:12 UTC = ~12:12 PM Israel time while Israel is on daylight saving
    # time (IDT, UTC+3). Offset a few minutes past the hour on purpose -
    # GitHub's scheduler gets congested right at the top of the hour, which
    # caused real multi-hour delays (and one missed day) when this was
    # "0 9 * * *". When Israel exits daylight saving time later in the year
    # (IST, UTC+2), this will land at ~11:12 AM Israel time instead - update
    # to "12 10 * * *" at that point to keep it around noon.
    - cron: "12 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  telegram-fetch-score-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search, scoring, dedup, and email digest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/run_daily_pipeline.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --cached --quiet || git commit -m "Update seen_jobs.json [skip ci]"
          git push
