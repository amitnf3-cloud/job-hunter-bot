name: Diagnostic - Greenhouse Token Check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  greenhouse-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Greenhouse board tokens against the live public API (no secrets needed)
        run: python scripts/diagnostic_greenhouse_check.py
