name: Diagnostic - mPrest Description Fetch Comparison

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mprest-description-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write resume file from secret
        env:
          PROJECT_MANAGER_RESUME: ${{ secrets.PROJECT_MANAGER_RESUME }}
        run: printf '%s' "$PROJECT_MANAGER_RESUME" > resumes/project_manager_resume.local.txt

      - name: Compare generic vs Comeet-specific description extraction, then score the result, for the mPrest job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/diagnostic_mprest_description.py
