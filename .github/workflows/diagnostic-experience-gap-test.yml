name: Diagnostic - Experience Gap Scoring Test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  experience-gap-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Score synthetic large-gap and small-gap postings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/test_experience_gap_scoring.py
