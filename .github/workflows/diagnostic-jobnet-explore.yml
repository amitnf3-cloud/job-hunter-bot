name: Diagnostic - JobNet Explore

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jobnet-explore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Explore JobNet's real page/form structure (read-only)
        run: python scripts/explore_jobnet.py
